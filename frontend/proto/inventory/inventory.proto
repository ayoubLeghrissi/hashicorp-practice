syntax = "proto3";

package inventory;

option go_package = "github.com/services/proto/inventory";

import "product/product.proto";

// InventoryItem message
message InventoryItem {
  string id = 1;
  string product_id = 2;
  int32 quantity = 3;
  string warehouse_location = 4;
  int32 reorder_level = 5;
  string updated_at = 6;
  product.Product product = 7;
}

// Request / Response messages
message AddInventoryRequest {
  string product_id = 1;
  int32 quantity = 2;
  string warehouse_location = 3;
  int32 reorder_level = 4;
}

message AddInventoryResponse {
  InventoryItem item = 1;
}

message GetInventoryRequest {
  string product_id = 1;
}

message GetInventoryResponse {
  InventoryItem item = 1;
}

message ListInventoryRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListInventoryResponse {
  repeated InventoryItem items = 1;
  int32 total_count = 2;
}

message UpdateQuantityRequest {
  string product_id = 1;
  int32 quantity_change = 2; // positive to add, negative to deduct
}

message UpdateQuantityResponse {
  InventoryItem item = 1;
  bool success = 2;
}

message DeductInventoryRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message DeductInventoryResponse {
  bool success = 1;
  int32 remaining_quantity = 2;
}

message CheckStockRequest {
  string product_id = 1;
  int32 requested_quantity = 2;
}

message CheckStockResponse {
  bool in_stock = 1;
  int32 available_quantity = 2;
}

// Inventory Service
service InventoryService {
  rpc AddInventory(AddInventoryRequest) returns (AddInventoryResponse);
  rpc GetInventory(GetInventoryRequest) returns (GetInventoryResponse);
  rpc ListInventory(ListInventoryRequest) returns (ListInventoryResponse);
  rpc UpdateQuantity(UpdateQuantityRequest) returns (UpdateQuantityResponse);
  rpc DeductInventory(DeductInventoryRequest) returns (DeductInventoryResponse);
  rpc CheckStock(CheckStockRequest) returns (CheckStockResponse);
}
